<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ Distribuidora — Painel</title>
<link rel="icon" href="favicon-32.png" type="image/png">
<meta name="theme-color" content="#1F1F20">
<style>
  :root{--dourado:#C49F69;--pagina:#141415;--card:#1b1b1c;--texto:#f2f2f2;--sec:#9a9a9c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--pagina);color:var(--texto);
    font-family:"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .c{width:100%;max-width:380px;text-align:center;background:var(--card);border:2px solid var(--dourado);border-radius:16px;padding:28px 22px;
    box-shadow:0 14px 40px rgba(0,0,0,.45)}
  img{height:96px;width:auto;display:block;margin:0 auto 12px}
  h1{margin:0 0 4px;font-size:19px}
  p{margin:6px 0;color:var(--sec);font-size:13.5px;line-height:1.5}
  a.b{display:inline-block;margin-top:14px;background:var(--dourado);color:#1a1a1a;border-radius:8px;padding:11px 26px;font-weight:700;text-decoration:none}
  .o{display:none}
</style>
</head>
<body>
  <div class="c">
    <img src="icon-192.png" alt="AJ Distribuidora">
    <h1>AJ Distribuidora</h1>
    <p id="m">Abrindo o painel…</p>
    <div class="o" id="o">
      <p>Não foi possível achar o endereço do painel agora. O computador do painel pode estar desligado ou reiniciando.</p>
      <a class="b" href="" onclick="location.reload();return false">Tentar de novo</a>
    </div>
  </div>
<script>
// Endereco fixo do painel (copia na nuvem: funciona mesmo com o computador do painel desligado).
location.replace("https://aj-painel.aj-painel-nuvem.workers.dev/" + (location.hash || ""));
</script>
</body>
</html>
